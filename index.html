<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אירית - יד שנייה</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f7f4ee;
            --card-bg: #fffdf9;
            --primary-color: #5c4033;
            --accent-color: #8c6d53;
            --text-color: #2c221e;
            --border-color: #d8cbb8;
            --sale-bg: #f3e5db;
            --sale-border: #c49a6c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Assistant', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(92, 64, 51, 0.08);
        }

        /* עיצוב הודעת ההנחה המיוחדת */
        .sale-banner {
            display: none; /* מוסתר כברירת מחדל */
            background-color: var(--sale-bg);
            border: 1px dashed var(--sale-border);
            color: var(--primary-color);
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 25px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }






        

        .logo-placeholder {
            width: 80px;
            height: 80px;
            background-color: #ebd7c8;
            color: var(--primary-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 20px;
            border: 2px dashed var(--accent-color);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            color: var(--primary-color);
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 16px;
            color: var(--accent-color);
            margin-bottom: 30px;
            font-weight: 600;
        }

        .divider {
            height: 1px;
            background-color: var(--border-color);
            margin: 25px 0;
            width: 100%;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 14px 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 17px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .btn-facebook {
            background-color: #4267B2;
            color: white;
        }

        .btn-facebook:hover {
            background-color: #365899;
            transform: translateY(-2px);
        }

        .btn-maps {
            background-color: #34A853;
            color: white;
        }
